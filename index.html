<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>征婚信息发布</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>征婚信息发布</h1>
<p class="sub">真实审核 · 仅作展示 · 自行联系</p>

<div class="cta">
  投稿请加微信：<b>你的微信号</b><br>
  <span>50元/条 · 审核后发布 · 不参与撮合</span>
</div>

<div id="list"></div>

<div class="footer">
  本站仅提供征婚信息展示服务，所有信息由发布者本人提供并负责。<br>
  本站不参与撮合、介绍、沟通，不保证信息真实性，请自行核实。<br>
  因联系产生的任何纠纷与本站无关。
</div>

<script>
fetch('data.json')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('list');
    list.innerHTML = data.map(p => `
      <div class="card">
        <img src="${p.photo}" alt="${p.name}" onerror="this.style.display='none'">
        <div class="name">${p.name}</div>
        <div class="meta">${p.age}岁 · ${p.city} · ${p.job} · ${p.marriage} · ${p.height}</div>
        <div class="intro">${p.intro}</div>
        <div class="req">择偶要求：${p.requirement}</div>
        <div class="contact">联系方式：${p.contact}</div>
      </div>
    `).join('');
  })
  .catch(err => {
    document.getElementById('list').innerHTML = '<p style="text-align:center;color:#999;">信息加载失败</p>';
    console.error(err);
  });
</script>

</body>
</html>
