<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>女生资料</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f5f6fa;color:#333;padding:20px}
.container{max-width:1100px;margin:0 auto}
h1{text-align:center;margin-bottom:24px;color:#e91e63}
.filters{background:#fff;padding:16px;border-radius:10px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.filters a{padding:6px 14px;border-radius:20px;background:#f0f0f0;color:#333;text-decoration:none;font-size:14px}
.filters a.active{background:#e91e63;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:.2s;text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card img{width:100%;height:220px;object-fit:cover;background:#eee}
.card .info{padding:12px}
.card .name{font-size:17px;font-weight:600;margin-bottom:6px}
.card .meta{font-size:13px;color:#888;line-height:1.7}
.tag{display:inline-block;padding:2px 8px;background:#fce4ec;color:#e91e63;border-radius:10px;font-size:12px;margin-right:4px}
.detail{background:#fff;border-radius:12px;padding:24px;max-width:800px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.detail img{width:200px;height:200px;object-fit:cover;border-radius:12px;float:left;margin-right:20px}
.detail h2{color:#e91e63;margin-bottom:16px}
.detail table{width:100%;border-collapse:collapse;margin:16px 0;clear:both}
.detail td{padding:8px;border-bottom:1px solid #f0f0f0}
.detail td:first-child{color:#888;width:100px}
.section{margin-top:20px}
.section h3{color:#e91e63;font-size:16px;margin-bottom:8px;border-left:4px solid #e91e63;padding-left:8px}
.back{display:inline-block;margin-bottom:16px;color:#e91e63;text-decoration:none}
</style>
</head>
<body><div class="container">
<h1>女生资料</h1>
<div class="filters"><a class="" href="index.html">全部</a><a class="" href="male.html">男生</a><a class="active" href="female.html">女生</a></div>
<div class="grid">

<a class="card" href="profile_2.html">
  <img src="photos/002.jpeg" alt="翠花" loading="lazy"
       onerror="this.src='photos/default.jpg'">
  <div class="info">
    <div class="name">翠花</div>
    <div class="meta">
      女 · 46岁 · 168cm<br>
      平顶山 · 初中<br>
      <span class="tag">比亚迪</span>
      
      
    </div>
  </div>
</a>

</div></div></body></html>
